name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    # Older Ubuntu = older glibc, so the binary runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          name=vc-overlay-$GITHUB_REF_NAME-x86_64-linux
          mkdir "$name"
          cp target/release/vc-overlay README.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          # Bare binary + checksum for the in-app updater.
          cp target/release/vc-overlay vc-overlay-x86_64-linux
          sha256sum vc-overlay-x86_64-linux > vc-overlay-x86_64-linux.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vc-overlay-v*.tar.gz* vc-overlay-x86_64-linux* --title "$GITHUB_REF_NAME" --generate-notes
