[package]
name = "vc-overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
fontdue = "0.9.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
ksni = { version = "0.3.7", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
tiny-skia = "0.12.0"
tungstenite = "0.30.0"
ureq = "3.5.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
